US=fallback, US节点, interval=60, max-timeout=2000, img-url=https://raw.githubusercontent.com/Orz-3/mini/master/Color/US.png
JP=fallback, JP节点, interval=60, max-timeout=2000, img-url=https://raw.githubusercontent.com/Orz-3/mini/master/Color/JP.png
HK=fallback, HK节点, interval=60, max-timeout=2000, img-url=https://raw.githubusercontent.com/Orz-3/mini/master/Color/HK.png
SG=fallback, SG节点, interval=60, max-timeout=2000, img-url=https://raw.githubusercontent.com/Orz-3/mini/master/Color/SG.png
TW=fallback, TW节点, interval=60, max-timeout=2000, img-url=https://raw.githubusercontent.com/Orz-3/mini/master/Color/TW.png
TR=fallback, TR节点, interval=60, max-timeout=2000,img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Turkey.png

Proxyz=select,  US, SG, Low, PROXY, HK, JP, TW, img-url=https://github.com/Orz-3/mini/blob/master/Color/Global.png?raw=true
Video=select,Proxyz, Low, DIRECT, img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Emby.png
# --------------------------------
# 兜底策略后备
Final=select,Proxyz, DIRECT, PROXY, img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Blackhole.png

